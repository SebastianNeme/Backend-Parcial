name: backend-parcial-local

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bibliotecas
      MYSQL_USER: bibliotecas
      MYSQL_PASSWORD: bibliotecas_local
      MYSQL_ROOT_PASSWORD: root_local
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mysql-data:
